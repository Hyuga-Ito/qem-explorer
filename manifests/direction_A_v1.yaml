# QEM Explorer v1.3 · Direction A · equal-budget phase diagrams · pre-registered data-collection manifest
# Execute:   python -m qemx.phase.run plan manifests/direction_A_v1.yaml
#            python -m qemx.phase.run run  manifests/direction_A_v1.yaml --out data/dirA_v1 --workers 8
#            python -m qemx.phase.run collect data/dirA_v1
# Every value below is part of the pre-registration: change it only by writing a new manifest version.
manifest_version: 1
study: direction-A-equal-budget-phase-diagrams
description: >
  Exact-engine phase diagrams RMSE(λ_LC, B) of eight QEM methods over four circuit families (n = 4, 6), on the
  fake_fez calibration snapshot with every gate error and relaxation rate scaled by s, plus a gate-only control,
  a coherent-error ablation (homogenized device with a coherent fraction χ at fixed λ), a device-transfer check, an Aer cross-check, hyperparameter
  and transpiler sensitivity. Budgets 1e3–1e8 are analytic (integer ledger); Monte-Carlo validation on a hashed subset.

defaults:
  device: fake_fez                     # qiskit-ibm-runtime 0.50.0 snapshot; its calibration hash is recorded per cell
  layout:                              # fixed physical chains (best calibrated n-qubit paths on fake_fez; frozen)
    4: [136, 143, 142, 141]
    6: [124, 123, 136, 143, 142, 141]
  opt_level: 1                         # transpile once per circuit (layout fixed, SABRE routing, seed 11)
  seed_transpiler: 11
  readout_mit: tensored                # every method except VD (2 calibration circuits, |0…0> and |1…1>)
  s_min: 32                            # ledger: >= 32 shots per calibration circuit
  s_tr_min: 32
  train_levels: [64, 256, 1024, 4096, 16384]   # learning: b(s_tr), u(s_tr) measured by Monte Carlo at these levels
  train_reps: 2000                     # … with 2000 replicates at the protocol level (1024) and 500 elsewhere
  train_reps_other: 500

budgets:                               # analytic ledger grid (collect): 51 log-spaced budgets 1e3 … 1e8
  grid: {log10_min: 3, log10_max: 8, points: 51}
  epsilons: [0.005, 0.01, 0.02, 0.05]  # target RMSEs for B*(ε)

methods:
  RAW:   {estimator: raw}
  ZNE-R: {estimator: zne, scales: [1.0, 3.0, 5.0], folding: global, rule: richardson}
  ZNE-E: {estimator: zne, scales: [1.0, 3.0, 5.0], folding: global, rule: exponential}
  PEC:   {estimator: pec, construction: inverse, model: depolarizing, scope: all, shots_per_circuit: 1}
  CDR:   {estimator: learning, features: cdr, model: ols, alpha: 0.0, n_train: 16, train_shots: 1024,
          strategy: adaptive, min_spread: 0.05, keep: 0}
  VD:    {estimator: vd, M: 2}
  NIL-L: {estimator: learning, features: nil, model: lasso, alpha: 1.0e-4, n_train: 16, train_shots: 1024,
          strategy: adaptive, min_spread: 0.05, keep: 0}
  NIL-R: {estimator: learning, features: nil, model: ridge, alpha: 1.0e-3, n_train: 16, train_shots: 1024,
          strategy: adaptive, min_spread: 0.05, keep: 0}
  # sensitivity variants (stage E only)
  ZNE-R123:  {estimator: zne, scales: [1.0, 2.0, 3.0], folding: global, rule: richardson}
  ZNE-LIN:   {estimator: zne, scales: [1.0, 3.0], folding: global, rule: linear}
  ZNE-R-RC:  {estimator: zne, scales: [1.0, 3.0, 5.0], folding: global, rule: richardson, twirl: 2q}
  PEC-GATE:  {estimator: pec, construction: inverse, model: learned, scope: all, shots_per_circuit: 1}
  CDR-32:    {estimator: learning, features: cdr, model: ols, alpha: 0.0, n_train: 32, train_shots: 1024,
              strategy: adaptive, min_spread: 0.05, keep: 0}
  NIL-L-a3:  {estimator: learning, features: nil, model: lasso, alpha: 1.0e-3, n_train: 16, train_shots: 1024,
              strategy: adaptive, min_spread: 0.05, keep: 0}
  NIL-L-a2:  {estimator: learning, features: nil, model: lasso, alpha: 1.0e-2, n_train: 16, train_shots: 1024,
              strategy: adaptive, min_spread: 0.05, keep: 0}
  NIL-R-a2:  {estimator: learning, features: nil, model: ridge, alpha: 1.0e-2, n_train: 16, train_shots: 1024,
              strategy: adaptive, min_spread: 0.05, keep: 0}
  NIL-R-32:  {estimator: learning, features: nil, model: ridge, alpha: 1.0e-3, n_train: 32, train_shots: 1024,
              strategy: adaptive, min_spread: 0.05, keep: 0}
  VD-3:      {estimator: vd, M: 3}
  PEC-AER:   {estimator: pec, construction: inverse, model: depolarizing, scope: all, shots_per_circuit: 1,
              instances: 1024}           # stage D: Aer cannot apply signed maps; mean from 1024 sampled instances

method_sets:
  core: [RAW, ZNE-R, ZNE-E, PEC, CDR, VD, NIL-L, NIL-R]
  sensitivity: [RAW, ZNE-R, ZNE-R123, ZNE-LIN, ZNE-R-RC, PEC, PEC-GATE, CDR, CDR-32, NIL-L, NIL-L-a3, NIL-L-a2,
                NIL-R, NIL-R-a2, NIL-R-32, VD, VD-3]

circuits:
  all:
    - {family: qft, n: 4, m: [null, 1, 2], s: 1}            # F·F†|1> (ramp:1), AQFT cutoffs; P(1)
    - {family: qft, n: 6, m: [null, 1, 2, 3], s: 1}
    - {family: ghz, n: [4, 6], theta: 1.0471975511965976}  # RY(π/3) + CX ladder; <X^⊗n> = sin(π/3)
    - {family: ising, n: [4, 6], steps: [1, 2, 3, 4, 6, 8], T: 1.0, J: 1.0, h: 1.0}   # <Z_{n/2}>
    - {family: brickwork, n: [4, 6], layers: [2, 4, 6, 8], seed: [0, 1, 2]}         # <Z_{n/2}>
  subset:                                                   # stages D, E, F
    - {family: qft, n: 4, m: null, s: 1}
    - {family: qft, n: 6, m: 2, s: 1}
    - {family: ghz, n: 6, theta: 1.0471975511965976}
    - {family: ising, n: 6, steps: 4, T: 1.0, J: 1.0, h: 1.0}
    - {family: brickwork, n: 6, layers: 6, seed: 0}

stages:
  - name: A1-primary
    description: "fake_fez × s, readout on, tensored mitigation (VD: ideal readout, flagged optimistic)"
    engine: E2
    circuits: all
    methods: core
    scales: [0.25, 0.5, 1.0, 1.5, 2.0, 3.0, 4.0, 6.0]
    readout: "on"
    validate: {fraction: 0.15, budgets: [1.0e+3, 1.0e+4, 1.0e+5, 1.0e+6, 1.0e+7, 1.0e+8], reps: 2000,
               policies: [fixed, opt]}
  - name: A2-gate-only
    description: "the same cells without readout error (no calibration, w = 0): isolates gate and idle noise"
    engine: E2
    circuits: all
    methods: core
    scales: [0.25, 0.5, 1.0, 1.5, 2.0, 3.0, 4.0, 6.0]
    readout: "off"
    validate: {fraction: 0.05, budgets: [1.0e+4, 1.0e+6], reps: 2000, policies: [fixed]}
  - name: B-coherent
    description: "fake_fez homogenized to the chain's medians (same schedule), coherent fraction χ of each gate's non-relaxation error at fixed infidelity, hence fixed λ_LC"
    engine: E1
    circuits: all
    methods: core
    scales: [0.5, 1.0, 2.0, 4.0]
    readout: "on"
    coherent_fraction: [0.0, 0.25, 0.5]
    validate: {fraction: 0.05, budgets: [1.0e+4, 1.0e+6], reps: 2000, policies: [fixed]}
  - name: C-transfer
    description: "other calibration snapshots (best chain of each device): do boundaries collapse in λ_LC?"
    engine: E2
    circuits: all
    methods: core
    devices: [fake_torino, fake_kingston, fake_brisbane]
    layout: null
    scales: [0.5, 1.0, 2.0]
    readout: "on"
  - name: D-aer-check
    description: "the Aer device engine on a subset (PEC from 1024 sampled instances); must agree with A1"
    engine: E3
    circuits: subset
    methods: [RAW, ZNE-R, PEC-AER, CDR, NIL-R]
    scales: [1.0, 3.0]
    readout: "on"
  - name: E-sensitivity
    description: "pre-registered hyperparameter variants on the subset"
    engine: E2
    circuits: subset
    methods: sensitivity
    scales: [0.5, 1.0, 2.0, 4.0]
    readout: "on"
  - name: F-transpiler
    description: "optimization level 3 instead of 1 (the circuit, hence λ_LC, changes; the map should not)"
    engine: E2
    circuits: subset
    methods: core
    opt_levels: [3]
    scales: [1.0, 2.0]
    readout: "on"

qpu:                                   # documentation only: run with the IBM page / notebook, not with run.py
  backend: ibm_fez
  slot: QPU-2 (late November)
  circuits: [{family: ghz, n: 6, theta: 1.0471975511965976}, {family: ising, n: 6, steps: 4, T: 1.0, J: 1.0, h: 1.0}]
  methods: [RAW, ZNE-R, PEC, NIL-R]
  budget_per_method: 40000
  batches: 8                            # 8 independent batches of 5000 shots: sd estimate for the z-tests
  pec_shots_per_circuit: 100
  transpile: {optimization_level: 0, layout: chain of the day, guard: two-qubit count per folded circuit}
