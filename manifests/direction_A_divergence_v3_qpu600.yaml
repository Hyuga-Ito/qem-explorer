# QEM Explorer 1.5 · Direction A · divergence v3 for the shared 600-second campaign (main + supporting theme).
# A new version of direction_A_divergence_v2_qpu10.yaml (never edited in place): same circuits, methods, predictors and
# layout variants, with the budget per benchmark and method cut from 4 500 to 3 000 shots (1 000 per variant) so that
# the conservative planner (qemx.campaign: 0.57 ms per shot, 2 s per assumed sub-job, high = 1.3 × central) admits
# the whole suite with room for the pilot and the learning-method transfer subset inside 600 s minus a 60 s reserve.
# The v2 file needed ≈ 596 s (high) on its own, more than the 540 s the ledger admits.
#   python scripts/dirA_divergence.py plan manifests/direction_A_divergence_v3_qpu600.yaml --out data/dirA_div_v3
#   python -m qemx.campaign preflight data/dirA_div_v3 --ledger campaign_ledger.json
#   python scripts/rehearse_divergence.py manifests/direction_A_divergence_v3_qpu600.yaml --out data/reh_v3
# The same RAW / RO / ZNE-G / ZNE-L data double as the main study's hardware-transfer test of these methods' ranking
# (counted once). Consequence of the cut: shot noise per circuit grows by √(4500/3000) ≈ 1.22, so the smallest
# detectable divergence grows by about the same factor (see the rehearsal's power table).
manifest_version: 1
kind: divergence
study: direction-A-divergence-v3-qpu600
description: >
  Application circuits (GHZ, BV, QFT, Grover, random brickwork, Ising Trotter; 2–8 qubits) and spectator-context
  probes, each in three layout variants on disjoint chains of an IBM heavy-hex device, run raw, readout-mitigated and
  with global and local ZNE at the same total budget, and predicted from the device's own
  calibration of the day by a per-gate depolarizing model (primary), Chen et al.'s median model and the full
  fake-device model.

device: ibm_fez
fake: fake_fez
opt_level: 1
seed_transpiler: 11
layout: chain                    # layout variants need chains: every variant on its own disjoint chain
budget: 3000                     # per benchmark and method, shared by its 3 variants (1000 shots each)
cal_shots: 200                   # per readout-calibration circuit and variant
variants: {count: 3, mode: layouts}
replicates: 300
bootstrap: 200
exact_max_qubits: 4
aer_dm_max_qubits: 10
mc_shots: 100000
predictors: [depolarizing, chen, device]

methods:
  RAW:    {kind: raw}
  RO:     {kind: ro}
  ZNE-G:  {kind: zne, folding: global, scales: [1, 3, 5], rule: richardson}
  ZNE-L:  {kind: zne, folding: local, scales: [1, 3, 5], rule: richardson}

circuits:
  # spectator-context probes: the same random core on (c0, c1), spectators s0, s1 idle, superposed or driven
  - {family: context, n: 6, layers: [4, 16], spectators: [zero, plus, driven], seed: [0, 1]}
  # application circuits
  - {family: ghz, n: [2, 3, 4, 6, 8], theta: 1.5707963267948966, basis: Z}
  - {family: qft, n: [2, 3, 4, 5, 6], m: null, s: 1}
  - {family: bv, n: [3, 4, 6, 8]}
  - {family: brickwork, n: [4, 6], layers: [4, 8, 16], seed: 0}
  - {family: ising, n: [4, 6, 8], steps: [2, 4], T: 1.0, J: 1.0, h: 1.0}
  - {family: grover, n: 3, k: [1, 2]}
