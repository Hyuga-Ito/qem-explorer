# QEM Explorer v1.4.1 · Direction A · global against local folding for zero-noise extrapolation at equal total budget
# Execute:   python -m qemx.phase.run plan    manifests/direction_A_zne_folding_v1.yaml
#            python -m qemx.phase.run run     manifests/direction_A_zne_folding_v1.yaml --out data/dirA_zne_folding_v1 --workers 8
#            python -m qemx.phase.run collect data/dirA_zne_folding_v1
#            python scripts/dirA_zne_folding.py data/dirA_zne_folding_v1 --out figs_zne_folding
# Every value below is part of the pre-registration: change it only by writing a new manifest version.
#
# Folding. Global: U → U(U†U)^k. Local: every two-qubit gate G → G(G†G)^k, a seeded random subset once more for a
# fractional λ (the same subset at every noise scale s of a circuit: the method seed is a hash of the circuit). Both
# reach the same two-qubit gate count λ·n₂ (the nominal λ, "lam_est: gates"). They do not raise the noise the observable
# sees by the same factor: local folding leaves the one-qubit gates unfolded and lengthens only the idle windows next to
# a folded gate. "lam_est: fault-rate" fits against λ_eff = λ_LC(folded)/λ_LC(original), the light-cone fault rate of
# the noise model (qemx.phase.lightcone). In this simulation the model is the one that generates the data, so the
# fault-rate variants (ZNE-Gf, ZNE-Lf) use an exact λ_eff — an optimistic reference. On hardware λ_eff would come from
# the backend's calibration and inherit its errors (direction_A_divergence_v1 measures how large those are).
#
# Equal budget. Every method of a cell is costed by the same ledger (qemx.phase.ledger): target shots, the readout
# calibration (2 circuits, ≥ 32 shots each) and, for the learning methods, T × k training circuits, all inside one
# total budget B. ZNE's target shots are split N_j ∝ |η_j|σ_j over its folded circuits.
manifest_version: 1
study: direction-A-zne-folding
description: >
  Global against local unitary folding for ZNE on Grover, QFT, random brickwork, Bernstein–Vazirani and GHZ circuits
  of 3–6 qubits (3–189 two-qubit gates after compilation to fake_fez), at eight noise scales, with and without readout
  error, with coherent gate errors, and as a component of composed methods (ZNE outer over PEC inner; local fold
  neighbors inside NIL). Head-to-head comparison at equal total budget: the exact crossover budgets of the ledger, the
  effective noise scales λ_eff reached by each folding, and the bias that a mismatch between the nominal and the
  effective λ causes.

defaults:
  device: fake_fez
  layout:                              # nested sub-chains of direction A's frozen 6-qubit chain
    3: [143, 142, 141]
    4: [136, 143, 142, 141]
    5: [123, 136, 143, 142, 141]
    6: [124, 123, 136, 143, 142, 141]
  opt_level: 1
  seed_transpiler: 11
  readout_mit: tensored
  s_min: 32
  s_tr_min: 32
  train_levels: [64, 256, 1024, 4096, 16384]
  train_reps: 2000
  train_reps_other: 500

budgets:
  grid: {log10_min: 3, log10_max: 8, points: 51}
  epsilons: [0.005, 0.01, 0.02, 0.05]

methods:
  RAW:       {estimator: raw}
  # ---- the head-to-head pairs: same scales and rule, global against local folding
  ZNE-G:     {estimator: zne, scales: [1.0, 3.0, 5.0], folding: global, rule: richardson}      # = ZNE-R of run 2
  ZNE-L:     {estimator: zne, scales: [1.0, 3.0, 5.0], folding: local, rule: richardson}
  ZNE-Gf:    {estimator: zne, scales: [1.0, 3.0, 5.0], folding: global, rule: richardson, lam_est: fault-rate}
  ZNE-Lf:    {estimator: zne, scales: [1.0, 3.0, 5.0], folding: local, rule: richardson, lam_est: fault-rate}
  ZNE-G-lin: {estimator: zne, scales: [1.0, 3.0], folding: global, rule: linear}
  ZNE-L-lin: {estimator: zne, scales: [1.0, 3.0], folding: local, rule: linear}
  # ---- folding inside composed methods (stage F4)
  NIL-ZNE-G: {estimator: nil, neighbors: fold, scales: [1.0, 3.0, 5.0], folding: global, model: l1, l1_bound: 5.0,
              intercept: false, n_train: 16, ensemble: design4, target_split: optimal, train_shots: 1024}
  NIL-ZNE-L: {estimator: nil, neighbors: fold, scales: [1.0, 3.0, 5.0], folding: local, model: l1, l1_bound: 5.0,
              intercept: false, n_train: 16, ensemble: design4, target_split: optimal, train_shots: 1024}
  ZNE-G-PEC: {estimator: chain, outer: zne, inner: pec, zne_scales: [1.0, 3.0, 5.0], zne_folding: global,
              zne_rule: richardson, pec_construction: inverse, pec_model: depolarizing, pec_scope: all,
              pec_shots_per_circuit: 1}
  ZNE-L-PEC: {estimator: chain, outer: zne, inner: pec, zne_scales: [1.0, 3.0, 5.0], zne_folding: local,
              zne_rule: richardson, pec_construction: inverse, pec_model: depolarizing, pec_scope: all,
              pec_shots_per_circuit: 1}
  # ---- fractional ZNE (stages F5, F6): λ = 1, 4/3, 5/3, 2 — a third of the gates folded once more per step
  ZNE-Gq:      {estimator: zne, scales: [1.0, 1.333, 1.667, 2.0], folding: global, rule: poly2}
  ZNE-Lq:      {estimator: zne, scales: [1.0, 1.333, 1.667, 2.0], folding: local, subset: stratified, rule: poly2}
  ZNE-Lq-exp:  {estimator: zne, scales: [1.0, 1.333, 1.667, 2.0], folding: local, subset: stratified,
                rule: exponential}
  ZNE-Lq-lin:  {estimator: zne, scales: [1.0, 1.333, 1.667, 2.0], folding: local, subset: stratified, rule: linear}
  ZNE-Lq-R:    {estimator: zne, scales: [1.0, 1.333, 1.667, 2.0], folding: local, subset: stratified,
                rule: richardson}
  ZNE-Lq-nest: {estimator: zne, scales: [1.0, 1.333, 1.667, 2.0], folding: local, subset: nested, rule: poly2}
  ZNE-Lq-bal:  {estimator: zne, scales: [1.0, 1.333, 1.667, 2.0], folding: local, subset: balanced, rule: poly2}
  ZNE-Lq-rand: {estimator: zne, scales: [1.0, 1.333, 1.667, 2.0], folding: local, subset: random, rule: poly2}
  # the subset's own effect on E(λ) averaged out: K independent nested subsets per fractional λ, the same shots
  ZNE-Lq-avg4:  {estimator: zne, scales: [1.0, 1.333, 1.667, 2.0], folding: local, subset: nested, fold_draws: 4,
                 rule: poly2}
  ZNE-Lq-avg16: {estimator: zne, scales: [1.0, 1.333, 1.667, 2.0], folding: local, subset: nested, fold_draws: 16,
                 rule: poly2}

method_sets:
  folding:  [ZNE-G, ZNE-L, ZNE-Gf, ZNE-Lf, ZNE-G-lin, ZNE-L-lin, RAW]
  pipeline: [ZNE-G, ZNE-L, NIL-ZNE-G, NIL-ZNE-L, ZNE-G-PEC, ZNE-L-PEC, RAW]
  fractional: [ZNE-G, ZNE-Gq, ZNE-Lq, ZNE-Lq-exp, ZNE-Lq-lin, ZNE-Lq-R, RAW]
  subsets: [ZNE-G, ZNE-Lq, ZNE-Lq-nest, ZNE-Lq-bal, ZNE-Lq-rand, ZNE-Lq-avg4, ZNE-Lq-avg16, RAW]

circuits:
  all:                                 # 28 circuits; two-qubit gates after compilation: 3 (GHZ-4) … 189 (Grover-4, k=3)
    - {family: grover, n: 3, k: [1, 2]}
    - {family: grover, n: 4, k: [1, 2, 3]}
    - {family: qft, n: [4, 6], m: null, s: 1}
    - {family: qft, n: 6, m: 2, s: 1}
    - {family: brickwork, n: [4, 6], layers: [2, 4, 8, 16], seed: [0, 1]}
    - {family: bv, n: [4, 6]}          # n counts every qubit: 3 or 5 data qubits and the ancilla
    - {family: ghz, n: [4, 6], theta: 1.0471975511965976}
  frac:                                # the circuits with ≥ 6 two-qubit gates (fractional steps of 1/3 resolvable)
    - {family: grover, n: 3, k: [1, 2]}
    - {family: grover, n: 4, k: [1, 2, 3]}
    - {family: qft, n: [4, 6], m: null, s: 1}
    - {family: qft, n: 6, m: 2, s: 1}
    - {family: brickwork, n: [4, 6], layers: [4, 8, 16], seed: [0, 1]}
    - {family: bv, n: [4, 6]}
  frac_subset:
    - {family: grover, n: 4, k: 2}
    - {family: qft, n: 6, m: null, s: 1}
    - {family: brickwork, n: 6, layers: 16, seed: 0}
    - {family: bv, n: 6}
  subset:
    - {family: grover, n: 3, k: 1}
    - {family: qft, n: 4, m: null, s: 1}
    - {family: brickwork, n: 4, layers: 8, seed: 0}
    - {family: bv, n: 4}

stages:
  - name: F1-folding
    description: "fake_fez × s, readout on, tensored mitigation: global against local folding at equal budget"
    engine: E2
    circuits: all
    methods: folding
    scales: [0.25, 0.5, 1.0, 1.5, 2.0, 3.0, 4.0]
    readout: "on"
    validate: {fraction: 0.1, budgets: [1.0e+4, 1.0e+6], reps: 2000, policies: [fixed]}
  - name: F2-gate-only
    description: "the same cells without readout error: gate and idle noise only"
    engine: E2
    circuits: all
    methods: folding
    scales: [0.25, 0.5, 1.0, 1.5, 2.0, 3.0, 4.0]
    readout: "off"
    validate: {fraction: 0.05, budgets: [1.0e+4, 1.0e+6], reps: 2000, policies: [fixed]}
  - name: F3-coherent
    description: "fake_fez homogenized, a coherent fraction χ of every gate's non-relaxation error at fixed infidelity (fixed λ_LC): coherent errors add in amplitude when a gate is repeated"
    engine: E1
    circuits: all
    methods: folding
    scales: [0.5, 1.0, 2.0, 4.0]
    readout: "on"
    coherent_fraction: [0.0, 0.25, 0.5]
  - name: F4-pipeline
    description: "folding as a component: ZNE (global, local) over PEC on every folded circuit; global and local fold neighbors inside NIL"
    engine: E2
    circuits: subset
    methods: pipeline
    scales: [0.25, 0.5, 1.0, 2.0]
    readout: "on"
    validate: {fraction: 0.25, budgets: [1.0e+4, 1.0e+6], reps: 1000, policies: [fixed]}
  - name: F5-fractional
    description: "fractional ZNE: λ = 1, 4/3, 5/3, 2 (global partial fold; local stratified subsets) against integer global folding, five extrapolation rules"
    engine: E2
    circuits: frac
    methods: fractional
    scales: [0.25, 0.5, 1.0, 1.5, 2.0, 3.0, 4.0]
    readout: "on"
    validate: {fraction: 0.1, budgets: [1.0e+4, 1.0e+6], reps: 2000, policies: [fixed]}
  - name: F6-subsets
    description: "which gates a fractional local fold repeats: stratified, nested random, error-balanced, random (1.4.0), and the average over 4 or 16 independent nested subsets (fold_draws)"
    engine: E2
    circuits: frac_subset
    methods: subsets
    scales: [0.5, 1.0, 2.0, 4.0]
    readout: "on"
