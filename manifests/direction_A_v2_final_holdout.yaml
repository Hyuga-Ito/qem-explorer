# QEM Explorer 1.5.1 · Main study · FINAL HOLDOUT (frozen 2026-10-18; do not run until the method is frozen)
#
# Purpose. The pilot's confirmatory subset (direction_A_v2_pilot.yaml) was inspected while the analysis was being
# developed, so it is a development benchmark, not an untouched test. This manifest defines new base circuits for
# a final confirmation. Every base circuit here is absent from the pilot and from direction_A_v2_study.yaml
# (checked by `python -m qemx.phase.run holdout-check`, test tests/test_final_holdout.py): other QFT inputs, other
# GHZ angles, other Ising fields, other brickwork seeds and depths, and Bernstein–Vazirani with non-default secrets.
# The protocols, device model, noise scales, readout arm, budget grid and Monte-Carlo settings equal the pilot's, so
# a model trained on development data describes these cells (qemx.rec_context compatibility check).
#
# Rules (docs/FINAL_HOLDOUT.md): run only after the recommender, its features, its abstention thresholds and the
# fallback are frozen and recorded; evaluate once with `python -m qemx.study holdout`; report every endpoint,
# including unfavorable ones; changes after the evaluation make it a development result again.
#   python -m qemx.phase.run run     manifests/direction_A_v2_final_holdout.yaml --out data/final_holdout --workers 2
#   python -m qemx.phase.run collect data/final_holdout
#   python -m qemx.study holdout data/<development run> data/final_holdout --out reports/final_holdout
manifest_version: 1
study: direction-A-v2-final-holdout
description: >
  Final, untouched holdout for the main study: 23 new base circuits (QFT, GHZ, Ising Trotter, brickwork,
  Bernstein–Vazirani; 4–6 qubits) under the pilot's protocols and device model. Run once, after the method is frozen.

defaults:
  device: fake_fez
  opt_level: 1
  seed_transpiler: 11
  readout_mit: tensored
  s_min: 32
  s_tr_min: 32
  train_levels: [256, 1024, 4096]
  train_reps: 300
  train_reps_other: 150

budgets:
  grid: {log10_min: 3, log10_max: 7, points: 41}
  epsilons: [0.01, 0.02, 0.05]

methods:
  RAW:    {estimator: raw}
  ZNE-R:  {estimator: zne, scales: [1.0, 3.0, 5.0], folding: global, rule: richardson}
  ZNE-L:  {estimator: zne, scales: [1.0, 3.0], folding: global, rule: linear}
  PEC:    {estimator: pec, construction: inverse, model: depolarizing, scope: all, shots_per_circuit: 1}
  CDR:    {estimator: learning, features: cdr, model: ols, alpha: 0.0, n_train: 16, train_shots: 1024,
           strategy: adaptive, min_spread: 0.05, keep: 0}
  FR-R:   {estimator: learning, features: fr, model: ridge, alpha: 1.0e-3, n_train: 16, train_shots: 1024,
           strategy: adaptive, min_spread: 0.05, keep: 0}
  NIL-G2: {estimator: nil, neighbors: pauli, positions: 2q, n_neighbors: 8, include_bare: true, model: l1,
           l1_bound: 2.0, intercept: false, n_train: 16, ensemble: design4, target_split: optimal, train_shots: 1024}
  VD:     {estimator: vd, M: 2}

method_sets:
  core: [RAW, ZNE-R, ZNE-L, PEC, CDR, FR-R, NIL-G2, VD]

circuits:
  holdout:
    - {family: qft, n: [4, 5], m: null, s: [3, 6]}
    - {family: ghz, n: [4, 5, 6], theta: [0.39269908169872414, 0.7853981633974483], basis: X}
    - {family: ising, n: [4, 5, 6], steps: [2], T: 1.0, J: 1.0, h: [0.75]}
    - {family: brickwork, n: [4, 5, 6], layers: [3], seed: [10, 11]}
    - {family: bv, n: [4], secret: [6, 12]}
    - {family: bv, n: [5], secret: [13, 25]}

stages:
  - name: H-main
    engine: E2
    circuits: holdout
    methods: core
    scales: [0.5, 1.0, 2.0]
    readout: "on"
