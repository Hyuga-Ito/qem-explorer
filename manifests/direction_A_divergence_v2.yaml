# QEM Explorer v1.4.1 · Direction A · divergence v2: what a component-level noise model misses on an IBM heavy-hex
# device, and which mechanism it is. v1 measures *how much* the device departs from its fake twin; v2 adds the designed
# experiments and estimators that say *why*:
#   * three layout variants per benchmark on disjoint chains of the chip (Chen et al.'s variants, here: where on the
#     heavy-hex lattice) → simple aggregation, plurality vote, Cochran's heterogeneity, the heavy-hex map;
#   * spectator-context probes (the same two-qubit core with idle |0⟩, superposed |+⟩ or driven spectators) → the
#     probe reading (idle dephasing / gate error / spectator crosstalk);
#   * global, local and fractional local folding of every circuit → the folding fingerprint (gate-, time- or
#     repetition-attached unmodeled error), with no extra circuits beyond the ZNE runs;
#   * the χ² ladder and the divergence budget over all circuits (readout-mitigated estimates).
#
# Validate the analysis on emulated devices with known injected errors BEFORE spending QPU time (minutes on 2 cores):
#   python scripts/dirA_divergence.py plan     manifests/direction_A_divergence_v2.yaml --out data/dirA_div_v2
#   python scripts/dirA_divergence.py emulate  data/dirA_div_v2 --tag null  --truth depolarizing --workers 4
#   python scripts/dirA_divergence.py emulate  data/dirA_div_v2 --tag xtalk --truth depolarizing --inject crosstalk=0.05
#   python scripts/dirA_divergence.py emulate  data/dirA_div_v2 --tag t2    --truth depolarizing --inject t2=30
#   python scripts/dirA_divergence.py emulate  data/dirA_div_v2 --tag scale --truth depolarizing --inject scale=1.6
#   python scripts/dirA_divergence.py analyze  data/dirA_div_v2 --tag null --out figs_v2_null --workers 4   (… each tag)
#   python scripts/dirA_divergence.py recovery "no injection=figs_v2_null" "gate errors ×1.6=figs_v2_scale" \
#          "T2 = 30 µs=figs_v2_t2" "ZZ crosstalk=figs_v2_xtalk" --out figs_v2_recovery
# Hardware (token from $QISKIT_IBM_TOKEN, a saved account or --ask-token; never a command-line argument or a file):
#   python scripts/dirA_divergence.py plan        manifests/direction_A_divergence_v2.yaml --out data/dirA_div_v2_ibm \
#          --backend ibm_fez                      # lay the chains out on today's calibration
#   python scripts/dirA_divergence.py run-ibm     data/dirA_div_v2_ibm --tag ibm
#   python scripts/dirA_divergence.py collect-ibm data/dirA_div_v2_ibm --tag ibm --wait
#   python scripts/dirA_divergence.py analyze     data/dirA_div_v2_ibm --tag ibm --out figs_v2_ibm --workers 4
#   python scripts/dirA_divergence.py recovery    … "ibm_fez=figs_v2_ibm" --out figs_v2_recovery
# Another Heron: change device/fake together (ibm_torino / fake_torino, ibm_kingston / fake_kingston, …).
# Cost: `plan` prints the exact totals (circuits, shots); see docs/v14/research_plan_divergence.md §6.
manifest_version: 1
kind: divergence
study: direction-A-divergence-v2
description: >
  Application circuits (GHZ, BV, QFT, Grover, random brickwork, Ising Trotter; 2–8 qubits) and spectator-context
  probes, each in three layout variants on disjoint chains of an IBM heavy-hex device, run raw, readout-mitigated and
  with global, local and fractional-local ZNE at the same total budget, and predicted from the device's own
  calibration of the day by a per-gate depolarizing model (primary), Chen et al.'s median model and the full
  fake-device model.

device: ibm_fez
fake: fake_fez
opt_level: 1
seed_transpiler: 11
layout: chain                    # layout variants need chains: every variant on its own disjoint chain
budget: 9000                     # per benchmark and method, shared by its 3 variants (3000 shots each)
cal_shots: 200                   # per readout-calibration circuit and variant
variants: {count: 3, mode: layouts}
replicates: 300
bootstrap: 200
exact_max_qubits: 4
aer_dm_max_qubits: 10
mc_shots: 100000
predictors: [depolarizing, chen, device]

methods:
  RAW:    {kind: raw}
  RO:     {kind: ro}
  ZNE-G:  {kind: zne, folding: global, scales: [1, 3, 5], rule: richardson}
  ZNE-L:  {kind: zne, folding: local, scales: [1, 3, 5], rule: richardson}
  # fractional local folding (λ = 1, 4/3, 5/3, 2; stratified subset): a third folding response for the fingerprint
  # and the mitigation that pays on the deepest circuits (λ_LC > 0.6, folding study F5); skipped, with a note in
  # the plan, on circuits with fewer than 6 two-qubit gates
  ZNE-Lq: {kind: zne, folding: local, subset: stratified, scales: [1, 1.333, 1.667, 2], rule: poly2}

circuits:
  # spectator-context probes: the same random core on (c0, c1), spectators s0, s1 idle, superposed or driven
  - {family: context, n: 6, layers: [2, 4, 8, 16], spectators: [zero, plus, driven], seed: [0, 1]}
  # application circuits
  - {family: ghz, n: [2, 3, 4, 6, 8], theta: 1.5707963267948966, basis: Z}
  - {family: qft, n: [2, 3, 4, 5, 6], m: null, s: 1}
  - {family: bv, n: [3, 4, 6, 8]}
  - {family: brickwork, n: [4, 6], layers: [4, 8, 16], seed: 0}
  - {family: ising, n: [4, 6, 8], steps: [2, 4], T: 1.0, J: 1.0, h: 1.0}
  - {family: grover, n: 3, k: [1, 2]}
