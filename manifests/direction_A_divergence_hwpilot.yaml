# QEM Explorer 1.5 · Stage 1 of docs/hardware_preflight.md: a one-job pilot that calibrates the usage model
# (QPU seconds per shot on the chosen backend, from job.usage()) before the confirmatory campaign.
# Four small benchmarks, one layout variant, raw only; the readout calibrations are part of every RO run, so RAW alone
# keeps the pilot to one job. Its data are a usage measurement, not part of any confirmatory analysis.
#   python scripts/dirA_divergence.py plan manifests/direction_A_divergence_hwpilot.yaml --out data/hwpilot --backend ibm_fez
#   python -m qemx.campaign preflight data/hwpilot --ledger campaign_ledger.json
manifest_version: 1
kind: divergence
study: direction-A-hardware-pilot
description: >
  Usage-calibration pilot: GHZ-2/3 and QFT-2/3, raw, one layout variant, 2 500 shots each (10 000 executions).
device: ibm_fez
fake: fake_fez
opt_level: 1
seed_transpiler: 11
layout: chain
budget: 2500
cal_shots: 100
variants: {count: 1, mode: layouts}
replicates: 200
bootstrap: 100
exact_max_qubits: 4
aer_dm_max_qubits: 6
mc_shots: 100000
predictors: [depolarizing]
methods:
  RAW: {kind: raw}
circuits:
  - {family: ghz, n: [2, 3], theta: 1.5707963267948966, basis: Z}
  - {family: qft, n: [2, 3], m: null, s: 1}
