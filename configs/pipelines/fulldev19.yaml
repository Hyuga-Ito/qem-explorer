# PLANNED development study of the next research stage (1.9.0; not executed). Measure first:
#   python -m qemx.selection plan configs/selection/fulldev19.yaml --measured runs/pilot19/dev --workers auto
#   python -m qemx.selection pipeline configs/pipelines/fulldev19.yaml --out runs/fulldev19 --workers auto
# Freezes the development policy (configuration, τ) on these labels. The reserved confirmation set
# (configs/selection/conf19.yaml) is labeled and evaluated once afterwards, with its own command — deliberately not a
# stage of this pipeline, so that running the development study can never trigger the confirmation.
schema: qemx.selection.pipeline/1
name: fulldev19
purpose: development
out: runs/fulldev19
workers: auto
development: configs/selection/fulldev19.yaml
plot_config: configs/selection/figures18.yaml
bundles:
  - {version: fulldev19-sim, feature_set: frozen, simulation: true}
  - {version: fulldev19-deployable, feature_set: deployable18, simulation: false}
recommend_check: {experiment: examples/experiments/qft_known_answer.yaml, budget: 100000, device: fake_fez}
profile: {widths: "3,4,5,6,7"}
scripts:
  - {name: portfolio, after: analyze, argv: [scripts/portfolio_comparison.py, --labels, "{out}/dev", --out, "{out}/portfolio"]}
stages: [plan, label, analyze, freeze, nested, freeze-complete, bundles, scripts-analyze, recommend-check, profile,
         figures, report, status]
