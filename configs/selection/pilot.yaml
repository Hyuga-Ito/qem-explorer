# Pilot workflow — the study executed for 1.6.0. Fake-device emulation only (calibration snapshots of fake_fez,
# fake_torino and fake_kyiv, exact density-matrix engine); 3–6 qubits; the full budget grid; 100 + 100 trials per
# (task, protocol, budget); 30 % of the base circuits (by a keyed hash) held back as the untouched final test.
# Note (decision D24): in this executed configuration a family parameter `seed` is consumed as the task's
# transpiler seed (TaskSpec.seed), not as the family's instance seed; every hea/qaoa/brickwork circuit here uses
# instance seed 0, and its base circuits differ by layers or p. Kept unchanged so the labeled tasks keep their
# ids; new configurations use `angle_seed` for the instance seed.
schema: qemx.selection.config/1
name: pilot
master_seed: 20261019
R: 100
budgets: [1000, 3000, 10000, 30000, 100000, 300000, 1000000, 3000000, 10000000, 30000000]
learning_designs: 6
protocols: [RAW, RO, ZNE-L, ZNE-R, ZNE-E, PEC, CDR, NIL]
final_test_fraction: 0.3
tasks:
  widths: [3, 4, 5, 6]
  widths_by_family: {qft: [3, 4, 5], grover: [3, 4]}
  families:
    qft: [{}, {m: 1}]
    ghz: [{theta: 1.0472}, {theta: 0.6}]
    ising: [{steps: 1}, {steps: 3}]
    brickwork: [{layers: 2, seed: 0}, {layers: 4, seed: 1}]
    grover: [{k: 1}]
    bv: [{}]
    hea: [{layers: 1, seed: 0}, {layers: 3, seed: 1}]
    qaoa: [{p: 1, seed: 0}, {p: 2, seed: 1}]
  inputs: [default, plus, product]
  observables: [default, z_mid, zz_mid, z_all]
  layouts: [best, alt]
  devices: [fake_fez, fake_torino, fake_kyiv]
  variants_per_base: 2
limits: {task_seconds: 3600, memory_gb: 3}
analysis:
  splits: [same-distribution, family, device, width, budget-extrap, budget-interp]
  split_options:
    same-distribution: {k: 5}
    width: {min_test_n: 6}
    budget-extrap: {max_train_B: 300000}
    device: {test_device: fake_kyiv}
  feature_sets: [size_budget, structure, lightcone, deployable, deployable+simulated]
  model_families: [ridge, enet, hgb, mlp]
  abstain_family: hgb
  abstain_set: deployable
  ablation_set: deployable+simulated
  bootstrap: 1000
  lc_repeats: 3
  other_split_sets: [size_budget, deployable]
  other_split_families: [ridge, hgb]
  extras: [ablation, learning_curve, deployed, budget_generalization, abstention, interval_coverage, certificates, floor_sensitivity]
