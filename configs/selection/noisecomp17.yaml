# Noise-composition study (1.7.0) — does the composition of the noise, not only its overall level, change which
# protocol wins? Declared before labeling. The three controlled circuits of the regime study (D23; n = 4 on the
# calibration-best chain of fake_fez) under one component changed at a time: two-qubit gate errors (g2), one-qubit gate
# errors (g1), relaxation rates (t: T1, T2 ÷ t), readout (ro), and a coherent fraction of every gate's error (chi;
# exact engine). The snapshot the protocols see and the execution law change together (no mismatch). The total fault
# weight lam_total of each setting is a recorded feature, so settings of equal aggregate error can be compared.
schema: qemx.selection.config/1
name: noisecomp17
status: executed
master_seed: 20261023
R: 100
budgets: [1000, 3000, 10000, 30000, 100000, 300000, 1000000, 3000000, 10000000, 30000000]
learning_designs: {mode: fresh, per_half: 10}
protocols: [RAW, RO, ZNE-L, ZNE-R, ZNE-E, PEC, CDR, NIL]
final_test_fraction: 0.0
tasks:
  widths: [4]
  families:
    ising: [{steps: 2}]
    hea: [{layers: 2, angle_seed: 2}]
    qaoa: [{p: 1, angle_seed: 3}]
  inputs: [default]
  observables: [default]
  layouts: [best]
  devices: [fake_fez, "fake_fez@g2=2", "fake_fez@g2=3", "fake_fez@g1=3", "fake_fez@t=2", "fake_fez@t=3",
            "fake_fez@ro=2", "fake_fez@ro=0.5", "fake_fez@chi=0.25", "fake_fez@chi=0.5"]
  variants_per_base: all
limits: {task_seconds: 3600, memory_gb: 3}
regimes:
  noise_axis: component
