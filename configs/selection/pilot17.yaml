# Corrected pilot (1.7.0) — the 1.6.0 pilot's tasks, split and seeds relabeled with fresh learning designs
# (review finding R1): every label half of CDR and NIL has its own pool of 10 independent training designs
# (selection pool ≠ evaluation pool), 10 trials per design, so selection and evaluation labels are independent and
# estimate the fresh-design risk. RAW, RO, ZNE and PEC use the same random streams as 1.6.0 (their trials are
# reproduced exactly). Same task ids as 1.6.0; the 30 % final-test share is the 1.6.0 final test, already evaluated
# once (historical, not untouched).
# Note (decision D24): a family parameter `seed` in this task grid is the transpiler seed (TaskSpec.seed), not the
# instance seed; kept so the tasks keep their 1.6.0 ids. New configurations use `angle_seed`.
status: executed
schema: qemx.selection.config/1
name: pilot17
master_seed: 20261019
R: 100
budgets: [1000, 3000, 10000, 30000, 100000, 300000, 1000000, 3000000, 10000000, 30000000]
learning_designs: {mode: fresh, per_half: 10}
protocols: [RAW, RO, ZNE-L, ZNE-R, ZNE-E, PEC, CDR, NIL]
final_test_fraction: 0.3
tasks:
  widths: [3, 4, 5, 6]
  widths_by_family: {qft: [3, 4, 5], grover: [3, 4]}
  families:
    qft: [{}, {m: 1}]
    ghz: [{theta: 1.0472}, {theta: 0.6}]
    ising: [{steps: 1}, {steps: 3}]
    brickwork: [{layers: 2, seed: 0}, {layers: 4, seed: 1}]
    grover: [{k: 1}]
    bv: [{}]
    hea: [{layers: 1, seed: 0}, {layers: 3, seed: 1}]
    qaoa: [{p: 1, seed: 0}, {p: 2, seed: 1}]
  inputs: [default, plus, product]
  observables: [default, z_mid, zz_mid, z_all]
  layouts: [best, alt]
  devices: [fake_fez, fake_torino, fake_kyiv]
  variants_per_base: 2
limits: {task_seconds: 3600, memory_gb: 3}
analysis:
  splits: [same-distribution, family, device, width, budget-extrap, budget-interp]
  split_options:
    same-distribution: {k: 5}
    width: {min_test_n: 6}
    budget-extrap: {max_train_B: 300000}
    device: {test_device: fake_kyiv}
  feature_sets: [size_budget, structure, lightcone, deployable, deployable+simulated]
  model_families: [ridge, enet, hgb, mlp, struct]
  abstain_family: hgb
  abstain_set: deployable
  ablation_set: deployable+simulated
  bootstrap: 1000
  lc_repeats: 3
  other_split_sets: [size_budget, deployable]
  other_split_families: [ridge, hgb, struct]
  extras: [ablation, learning_curve, deployed, budget_generalization, abstention, nested_selective, interval_coverage,
           certificates, floor_sensitivity, design_diagnostics]
