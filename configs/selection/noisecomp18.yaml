# Noise-composition study (1.8.0; exploratory) — matched circuits, one composition at a time, at *matched light-cone
# exposure*: is the winning protocol a function of the exposure alone? Declared before labeling. The three controlled
# circuits of the 1.7.0 composition study (n = 4, fake_fez best chain) under: the snapshot (s = 1); every rate × 2
# (s = 2); two-qubit gate errors only × 2.3 (g2 = 2.3) and relaxation only (T1, T2 ÷ 5.5, t = 5.5) — both chosen so
# that lam_lc matches s = 2 within ±10 % on all three circuits (computed with qemx.phase.lightcone before labeling:
# s=2 0.106/0.054/0.128; g2=2.3 ≈ 0.106/0.053/0.127; t=5.5 ≈ 0.107/0.051/0.143); s = 2 with half of every gate's
# non-relaxation error coherent (chi = 0.5: the same twirled exposure, different coherent structure); readout × 3
# (ro = 3, gates at the snapshot). Snapshot and execution law change together (no mismatch). The expanded portfolio.
