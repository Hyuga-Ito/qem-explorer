# Boundary-refinement workflow — NOT executed in 1.6.0. Refines the budget grid where the pilot's regime maps show a
# ranking reversal (between 1e4 and 1e6 for ZNE vs PEC, and above 1e6 for learning protocols) on the families where
# it occurs, with more trials per half so that a reversal can be resolved from the Monte-Carlo error.
schema: qemx.selection.config/1
name: boundary
master_seed: 20261021
R: 300
budgets: [10000, 17783, 31623, 56234, 100000, 177828, 316228, 562341, 1000000, 3000000, 10000000, 30000000]
learning_designs: 6
protocols: [RAW, RO, ZNE-L, ZNE-R, ZNE-E, PEC, CDR, NIL]
final_test_fraction: 0.0
tasks:
  widths: [3, 4, 5]
  families:
    ghz: [{theta: 1.0472}]
    ising: [{steps: 1}, {steps: 3}]
    hea: [{layers: 1, angle_seed: 0}]
    qaoa: [{p: 1, angle_seed: 0}]
  inputs: [default]
  observables: [default, z_all]
  layouts: [best]
  devices: [fake_fez]
  variants_per_base: 1
limits: {task_seconds: 3600, memory_gb: 3}
analysis:
  splits: [same-distribution]
  feature_sets: [deployable]
  model_families: [hgb]
  bootstrap: 1000
