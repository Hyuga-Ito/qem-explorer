# Controlled regime study (1.8.0; exploratory) — Figure 2 and Figure 3, panels B and C, for the expanded portfolio.
# Declared before labeling. The three controlled slices of regimes17 (decision D23: ising-4, hea-4, qaoa-4 on the
# fake_fez calibration-best chain), relabeled with portfolio-1.8 (17 candidates) and seed scheme 2 (namespaced
# preparation streams; common random numbers within a base circuit, crn: base, so the cells of one slice share their
# design draws and differ only in the noise). Within a slice only the calibration error scale s changes: every
# reported gate error and every relaxation rate of the fake_fez snapshot × s (readout unchanged), applied to the
# snapshot the protocols see AND to the execution law (no mismatch). A second block varies only the observable of the
# Ising slice (Figure 3B); a third only the layout of each slice at s = 1 (supplementary). None of these base circuits
# is in dev18 or conf18 (they are 1.6/1.7 exploration circuits), so the recommender's choices on them are
# out-of-sample; the labels themselves are new (scheme 2) and are not comparable trial by trial with regimes17.
schema: qemx.selection.config/1
status: planned
name: regimes18
master_seed: 20261027
R: 60
budgets: [1000, 3000, 10000, 30000, 100000, 300000, 1000000, 3000000, 10000000, 30000000]
learning_designs: {mode: fresh, per_half: 6, seed_scheme: 2, crn: base}
protocols: [RAW, RO, ZNE-L, ZNE-R, ZNE-E, PEC, CDR, NIL, RO-TREX, RO-TW, RO-DD, ZNE-L-TW, ZNE-E-B, PEC-TW, FR, SV,
            "ZNE-L∘SV"]
final_test_fraction: 0.0
tasks:
  - widths: [4]
    families:
      ising: [{steps: 2}]
      hea: [{layers: 2, angle_seed: 2}]
      qaoa: [{p: 1, angle_seed: 3}]
    inputs: [default]
    observables: [default]
    layouts: [best]
    devices: [fake_fez, "fake_fez@s=0.5", "fake_fez@s=1.5", "fake_fez@s=2", "fake_fez@s=3"]
    variants_per_base: all
  - widths: [4]
    families:
      ising: [{steps: 2}]
    inputs: [default]
    observables: [default, z_mid, zz_mid, z_all]
    layouts: [best]
    devices: [fake_fez]
    variants_per_base: all
  - widths: [4]
    families:
      ising: [{steps: 2}]
      hea: [{layers: 2, angle_seed: 2}]
      qaoa: [{p: 1, angle_seed: 3}]
    inputs: [default]
    observables: [default]
    layouts: [best, alt]
    devices: [fake_fez]
    variants_per_base: all
limits: {task_seconds: 3600, memory_gb: 3}
regimes:
  noise_axis: s                      # calibration error scale (dimensionless multiplier of the fake_fez snapshot)
  model_policy: frozen               # the recommender frozen on dev18 (runs/v18/freeze.json)
  observable_budget: 100000          # Figure 3B: budget of the observable comparison (declared before labeling)
  noise_budget: 100000               # Figure 3C: budget of the noise comparison (declared before labeling)
