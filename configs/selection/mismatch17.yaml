# Mismatch workflow relabeled with fresh learning designs (1.7.0; review R1): the 1.6.0 mismatch tasks, seeds and
# budgets unchanged; CDR and NIL draw 10 independent designs per label half (6 trials each).
#
# 1.6.0 text: mismatch workflow — executed in 1.6.0 at reduced scale. Hidden perturbations of the execution law; the policy,
# PEC's model and every allocation see only the calibration snapshot. Each budget is labeled twice: B and B − d(B),
# the budget left after the echo diagnostic, so the diagnostic-triggered policy is charged exactly.
# Note (decision D24): in this executed configuration a family parameter `seed` is consumed as the task's
# transpiler seed (TaskSpec.seed), not as the family's instance seed; every hea/qaoa/brickwork circuit here uses
# instance seed 0, and its base circuits differ by layers or p. Kept unchanged so the labeled tasks keep their
# ids; new configurations use `angle_seed` for the instance seed.
schema: qemx.selection.config/1
status: executed
name: mismatch17
master_seed: 20261020
R: 60
budgets: [1000, 10000, 100000, 1000000, 10000000]
learning_designs: {mode: fresh, per_half: 10}
protocols: [RAW, RO, ZNE-L, ZNE-R, ZNE-E, PEC, CDR, NIL]
final_test_fraction: 0.0
tasks:
  widths: [3, 4]
  families:
    ghz: [{theta: 1.0472}]
    ising: [{steps: 3}]
    hea: [{layers: 1, seed: 0}]
    qaoa: [{p: 1, seed: 0}]
    brickwork: [{layers: 2, seed: 0}]
  inputs: [default]
  observables: [default]
  layouts: [best]
  devices: [fake_fez]
  variants_per_base: 0
limits: {task_seconds: 3600, memory_gb: 3}
mismatch:
  scenarios: [none, coherent-0.25, coherent-0.5, drift-1.5, drift-2, readout-2, crosstalk-0.02, crosstalk-0.05, temporal-2]
  diag_fraction: 0.02
  diag_min: 200
  alpha: 0.05
  robust: ZNE-L
  model_family: hgb
  model_set: deployable
  diagnostic_draws: 200          # single-deployment echo statistics drawn per (scenario, task, budget) (Figure 6B)
  reaction_holdout: type         # the learned reaction is trained without the held-out discrepancy type
