# Hardware validation plan of the 1.7.0 recommender (roadmap stage F) — PLANNED, NOT EXECUTED.
# `python -m qemx.selection hardware plan --hardware-config configs/selection/hardware17.yaml --bundle <bundle>`
# One shared QPU ceiling (600 s) minus a reserve for the whole campaign; admission on the conservative (high) usage
# estimate; execution only after the owner sets QEMX_HW_AUTHORIZE to the plan's digest and through the campaign ledger.
ceiling_s: 600
reserve_s: 60
budget: 20000            # total shots per protocol run (every calibration, training and target shot charged)
blocks: 4                # independent deployments per (task, protocol): the unit of a hardware risk estimate
device: fake_fez         # the calibration snapshot standing in for the target backend in the plan
backend_name: ibm_fez
protocols: [RAW, RO, recommended, SBS-B]
tasks:
  - {family: ising, n: 4, steps: 2}
  - {family: ghz, n: 4, theta: 1.0472}
# A third task (e.g. {family: hea, n: 4, layers: 1, angle_seed: 5}) does not fit the 600 s ceiling at 4 blocks with
# one job per (task, protocol, block): the preflight admits 28 of 36 such jobs (1.7.0 usage model and bundle).
