# Confirmation set (1.7.0) — new logical circuits for a once-only confirmation of the 1.7.0 frozen recommender.
#
# Declared before any of these tasks was labeled. Every base circuit is a new logical circuit (new angle seeds, new
# widths or parameters of the pilot's families); configs/selection/ancestry_registry.json records them with role
# "confirmation", and `python -m qemx.selection confirm` refuses to run if any of them appears in another study.
# Variants and the device/observable/layout pool follow the pilot (in-distribution confirmation). Trained on the
# corrected pilot's development set and its historical final test (both labeled with fresh designs), evaluated once.
schema: qemx.selection.config/1
name: confirm17
status: executed
master_seed: 20261101
R: 100
budgets: [1000, 3000, 10000, 30000, 100000, 300000, 1000000, 3000000, 10000000, 30000000]
learning_designs: {mode: fresh, per_half: 10}
protocols: [RAW, RO, ZNE-L, ZNE-R, ZNE-E, PEC, CDR, NIL]
final_test_fraction: 0.0
tasks:
  - widths: [4, 5, 6]
    families:
      hea: [{layers: 2, angle_seed: 101}]
      qaoa: [{p: 1, angle_seed: 201}, {p: 2, angle_seed: 202}]
      ising: [{steps: 2, h: 0.7}]
    inputs: [default, plus, product]
    observables: [default, z_mid, zz_mid, z_all]
    layouts: [best, alt]
    devices: [fake_fez, fake_torino, fake_kyiv]
    variants_per_base: 1
  - widths: [3, 5]
    families:
      ghz: [{theta: 0.8}]
      brickwork: [{layers: 3, angle_seed: 301}]
      ising: [{steps: 2}]
    inputs: [default, plus, product]
    observables: [default, z_mid, zz_mid, z_all]
    layouts: [best, alt]
    devices: [fake_fez, fake_torino, fake_kyiv]
    variants_per_base: 1
  - widths: [4, 6]
