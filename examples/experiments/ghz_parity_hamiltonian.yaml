# QEM Explorer 1.5 · one experiment (offline): a GHZ state, a Hamiltonian observable measured in several settings.
#   python -m qemx.experiment run examples/experiments/ghz_parity_hamiltonian.yaml --out results/ghz
schema: qemx.experiment/1
name: ghz-hamiltonian
circuit:
  template: ghz
  params: {n: 4}
observable: {pauli: "Z0*Z1 + Z1*Z2 + Z2*Z3 + 0.5*X0*X1*X2*X3"}
noise: {p1: 0.002, p2: 0.02, amp_damp: 0.001, ro01: 0.01, ro10: 0.02}
methods:
  - {preset: Unmitigated}
  - {preset: "ZNE · linear"}
  - {estimator: raw, readout: tensored}
budget: {shots: 20000}
run: {seed: 7, repeats: 60}
