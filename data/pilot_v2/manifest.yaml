# QEM Explorer 1.5 · Main study (feature-based QEM performance and selection) · OFFLINE PILOT
# A new version of direction_A_v1 (which stays as pre-registered). Changes:
#   * method keys say what they are: FR-* is feature regression (estimator learning, features fr; 1.3–1.4 manifests
#     called it NIL-*); NIL-G2 is neighbor-informed learning (estimator nil, Chen et al. arXiv:2512.12578);
#   * several base circuits per family (grouped held-out evaluation needs groups);
#   * a confirmatory subset, split by base circuit before any outcome exists (confirmatory.seed);
#   * fewer Monte-Carlo replicates of the training levels than the production study (a pilot, minutes per cell).
# Run (offline, no credentials):
#   python -m qemx.phase.run plan    manifests/direction_A_v2_pilot.yaml
#   python -m qemx.phase.run run     manifests/direction_A_v2_pilot.yaml --out data/dirA_v2_pilot --workers 2
#   python -m qemx.phase.run collect data/dirA_v2_pilot
#   python -m qemx.study report data/dirA_v2_pilot --manifest manifests/direction_A_v2_pilot.yaml --out reports/pilot
manifest_version: 1
study: direction-A-v2-pilot
description: >
  Equal-total-budget comparison of raw, ZNE, PEC, CDR, FR, NIL and VD on 25 small application circuits (QFT, GHZ,
  Ising Trotter, random brickwork, Bernstein–Vazirani; 3–5 qubits) on the fake_fez device model at three noise
  scales; feature extraction at analysis time (qemx.features), regime maps and a baseline recommender (qemx.study).

defaults:
  device: fake_fez
  opt_level: 1
  seed_transpiler: 11
  readout_mit: tensored
  s_min: 32
  s_tr_min: 32
  train_levels: [256, 1024, 4096]
  train_reps: 300
  train_reps_other: 150

budgets:
  grid: {log10_min: 3, log10_max: 7, points: 41}
  epsilons: [0.01, 0.02, 0.05]

methods:
  RAW:    {estimator: raw}
  ZNE-R:  {estimator: zne, scales: [1.0, 3.0, 5.0], folding: global, rule: richardson}
  ZNE-L:  {estimator: zne, scales: [1.0, 3.0], folding: global, rule: linear}
  PEC:    {estimator: pec, construction: inverse, model: depolarizing, scope: all, shots_per_circuit: 1}
  CDR:    {estimator: learning, features: cdr, model: ols, alpha: 0.0, n_train: 16, train_shots: 1024,
           strategy: adaptive, min_spread: 0.05, keep: 0}
  FR-R:   {estimator: learning, features: fr, model: ridge, alpha: 1.0e-3, n_train: 16, train_shots: 1024,
           strategy: adaptive, min_spread: 0.05, keep: 0}
  NIL-G2: {estimator: nil, neighbors: pauli, positions: 2q, n_neighbors: 8, include_bare: true, model: l1,
           l1_bound: 2.0, intercept: false, n_train: 16, ensemble: design4, target_split: optimal, train_shots: 1024}
  VD:     {estimator: vd, M: 2}

method_sets:
  core: [RAW, ZNE-R, ZNE-L, PEC, CDR, FR-R, NIL-G2, VD]

circuits:
  pilot:
    - {family: qft, n: [3, 4, 5], m: null, s: 1}
    - {family: ghz, n: [3, 4, 5], theta: [0.5235987755982988, 1.0471975511965976], basis: X}
    - {family: ising, n: [3, 4, 5], steps: [1, 3], T: 1.0, J: 1.0, h: 1.0}
    - {family: brickwork, n: [4, 5], layers: [2, 4], seed: [0, 1]}
    - {family: bv, n: [3, 4]}

stages:
  - name: P-main
    engine: E2
    circuits: pilot
    methods: core
    scales: [0.5, 1.0, 2.0]
    readout: "on"
    confirmatory: {fraction: 0.25, seed: 2026}
